<!DOCTYPE html>
<html lang="ps">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALL PRODUCTION FILMS — Admin</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="/static/admin.css"
    >
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div>
            <h1>🎬 ALL PRODUCTION</h1>
            <p>Admin Panel</p>
        </div>

        <button
            id="refreshBtn"
            class="refresh-btn"
        >
            🔄
        </button>

    </header>


    <!-- ACCESS -->
    <section
        id="accessError"
        class="card hidden"
    >

        <div class="error-icon">
            🔒
        </div>

        <h2>Access Denied</h2>

        <p>
            This panel is only available
            to authorized administrators.
        </p>

    </section>


    <!-- ADMIN CONTENT -->
    <main
        id="adminContent"
        class="hidden"
    >

        <!-- STATISTICS -->

        <section>

            <h2 class="section-title">
                📊 Statistics
            </h2>

            <div class="stats-grid">

                <div class="stat-card">
                    <span>👥</span>
                    <strong id="usersCount">
                        0
                    </strong>
                    <small>Users</small>
                </div>

                <div class="stat-card">
                    <span>⭐</span>
                    <strong id="publishersCount">
                        0
                    </strong>
                    <small>Publishers</small>
                </div>

                <div class="stat-card">
                    <span>🎬</span>
                    <strong id="filmsCount">
                        0
                    </strong>
                    <small>Films</small>
                </div>

                <div class="stat-card">
                    <span>✅</span>
                    <strong id="approvedFilmsCount">
                        0
                    </strong>
                    <small>Approved</small>
                </div>

            </div>

        </section>


        <!-- SETTINGS -->

        <section>

            <h2 class="section-title">
                ⚙️ System Settings
            </h2>

            <div class="card">

                <label>
                    Referral Target
                </label>

                <div class="input-row">

                    <input
                        id="referralTarget"
                        type="number"
                        min="1"
                        placeholder="50"
                    >

                    <span class="input-suffix">
                        Referrals
                    </span>

                </div>


                <label>
                    Main Channel
                </label>

                <input
                    id="mainChannel"
                    type="text"
                    placeholder="@afghanproduction"
                >


                <label>
                    Mandatory Access Channel
                </label>

                <input
                    id="accessChannel"
                    type="text"
                    placeholder="@ALL_PASHTO"
                >


                <label class="switch-row">

                    <span>
                        Auto Approve Films
                    </span>

                    <input
                        id="autoApprove"
                        type="checkbox"
                    >

                    <span class="switch"></span>

                </label>


                <button
                    id="saveSettingsBtn"
                    class="primary-btn"
                >
                    💾 Save Settings
                </button>

                <p
                    id="settingsMessage"
                    class="message"
                ></p>

            </div>

        </section>


        <!-- CHANNELS -->

        <section>

            <h2 class="section-title">
                📢 Channels
            </h2>

            <div class="card">

                <h3>
                    ➕ Add Channel
                </h3>

                <input
                    id="channelTitle"
                    type="text"
                    placeholder="Channel name"
                >

                <input
                    id="channelUsername"
                    type="text"
                    placeholder="@channel_username"
                >

                <select id="channelCategory">

                    <option value="pashto">
                        پښتو فلمونه
                    </option>

                    <option value="official">
                        زموږ رسمي فلمونه
                    </option>

                    <option value="subtitle">
                        پښتو سبټایټل
                    </option>

                    <option value="general">
                        General
                    </option>

                </select>

                <button
                    id="addChannelBtn"
                    class="primary-btn"
                >
                    ➕ Add Channel
                </button>

            </div>


            <div
                id="channelsList"
                class="list"
            ></div>

        </section>


        <!-- FILMS -->

        <section>

            <div class="section-header">

                <h2 class="section-title">
                    🎬 Films
                </h2>

                <button
                    id="loadFilmsBtn"
                    class="small-btn"
                >
                    🔄 Refresh
                </button>

            </div>

            <div
                id="filmsList"
                class="list"
            ></div>

        </section>

    </main>

</div>


<script src="/static/admin.js"></script>

</body>
</html>
