<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALL PRODUCTION FILMS</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<div class="app">

    <header class="header">

        <div>
            <h1>🎬 ALL PRODUCTION</h1>
            <p>Films Mini App</p>
        </div>

        <div class="user-avatar" id="userAvatar">
            👤
        </div>

    </header>


    <section class="welcome">

        <h2 id="welcomeTitle">
            🎬 ښه راغلاست!
        </h2>

        <p>
            خپل خوښ فلم په اسانۍ پیدا کړئ.
        </p>

    </section>


    <section class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="🔎 د فلم نوم ولیکئ..."
        >

        <button
            id="searchButton"
            onclick="searchFilms()"
        >
            لټون
        </button>

    </section>


    <section class="quick-actions">

        <button onclick="showCategory('pashto')">
            🎬
            <span>پښتو ترجمه</span>
        </button>

        <button onclick="showOfficial()">
            📢
            <span>زموږ فلمونه</span>
        </button>

        <button onclick="showReferral()">
            👥
            <span>Referral</span>
        </button>

        <button onclick="showLeaders()">
            🏆
            <span>مشران</span>
        </button>

    </section>


    <section class="content">

        <div class="section-title">

            <h2 id="sectionTitle">
                🎬 وروستي فلمونه
            </h2>

        </div>


        <div
            id="loading"
            class="loading hidden"
        >
            ⏳ لږ انتظار...
        </div>


        <div
            id="results"
            class="film-grid"
        ></div>


        <div
            id="empty"
            class="empty hidden"
        >
            😔 فلم پیدا نه شو.
        </div>

    </section>


    <div
        id="modal"
        class="modal hidden"
    >

        <div class="modal-content">

            <button
                class="close"
                onclick="closeModal()"
            >
                ✕
            </button>

            <div id="modalBody"></div>

        </div>

    </div>


    <footer>

        <p>
            🎬 ALL PRODUCTION FILMS
        </p>

        <small>
            © 2026
        </small>

    </footer>

</div>


<script src="/static/app.js"></script>

</body>
</html>
